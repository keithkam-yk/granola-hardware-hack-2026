<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Doodle → Emoji</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0c12;
      --panel: rgba(22, 25, 34, .86);
      --line: rgba(255, 255, 255, .1);
      --text: #f6f3ea;
      --muted: #9b9aa5;
      --accent: #ffd85a;
      --accent-2: #ff7867;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 12% 10%, rgba(255, 216, 90, .14), transparent 30rem),
        radial-gradient(circle at 92% 88%, rgba(255, 120, 103, .12), transparent 28rem),
        var(--bg);
    }
    main { width: min(1040px, calc(100% - 28px)); margin: 0 auto; padding: 34px 0 42px; }
    header { margin-bottom: 22px; }
    .eyebrow { margin: 0 0 7px; color: var(--accent); font-size: 12px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(36px, 7vw, 72px); letter-spacing: -.055em; line-height: .96; }
    .subtitle { margin: 12px 0 0; color: var(--muted); font-size: 15px; }
    .layout { display: grid; grid-template-columns: minmax(300px, 1.08fr) minmax(280px, .92fr); gap: 16px; }
    .panel { border: 1px solid var(--line); border-radius: 22px; background: var(--panel); box-shadow: 0 24px 80px rgba(0, 0, 0, .24); backdrop-filter: blur(18px); }
    .draw-panel { padding: 16px; }
    .canvas-wrap { position: relative; overflow: hidden; border: 1px solid rgba(255,255,255,.13); border-radius: 16px; background: #000; }
    #canvas { display: block; width: 100%; aspect-ratio: 1; cursor: crosshair; touch-action: none; }
    .hint { position: absolute; inset: 0; display: grid; place-items: center; color: #64646d; font-weight: 700; pointer-events: none; transition: opacity .2s; }
    .hint.hidden { opacity: 0; }
    .controls { display: flex; gap: 10px; margin-top: 14px; }
    button { border: 1px solid var(--line); border-radius: 12px; padding: 11px 16px; color: var(--text); background: rgba(255,255,255,.06); font: inherit; font-weight: 750; cursor: pointer; }
    button:hover { background: rgba(255,255,255,.1); }
    button:disabled { cursor: wait; opacity: .55; }
    #predict { flex: 1; color: #17140a; border-color: transparent; background: var(--accent); }
    #predict:hover { background: #ffe27c; }
    .result-panel { min-height: 100%; padding: 22px; display: flex; flex-direction: column; }
    .status { color: var(--muted); font-size: 13px; min-height: 20px; }
    .status a { color: var(--accent); }
    .hero-result { min-height: 218px; display: grid; align-content: center; justify-items: center; text-align: center; }
    .emoji { font-size: clamp(76px, 12vw, 120px); line-height: 1; filter: drop-shadow(0 12px 28px rgba(255, 216, 90, .18)); }
    .label { margin-top: 13px; font-size: clamp(25px, 4vw, 38px); font-weight: 850; letter-spacing: -.035em; text-transform: capitalize; }
    .confidence { margin-top: 4px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .alternatives { display: grid; gap: 9px; margin-top: auto; }
    .alternative { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; font-size: 13px; }
    .alt-label { text-transform: capitalize; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .score { color: var(--muted); font-variant-numeric: tabular-nums; }
    .bar { grid-column: 2 / 4; height: 4px; margin-top: -5px; overflow: hidden; border-radius: 99px; background: rgba(255,255,255,.07); }
    .bar span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
    .empty { color: #686873; font-size: 15px; line-height: 1.5; max-width: 260px; }
    @media (max-width: 760px) {
      main { padding-top: 24px; }
      .layout { grid-template-columns: 1fr; }
      .hero-result { min-height: 180px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">QuickDraw · SE-ResNet</p>
      <h1>Doodle → Emoji</h1>
      <p class="subtitle">Draw one recognisable thing. The model runs locally on this Mac—no training required.</p>
    </header>

    <section class="layout">
      <div class="panel draw-panel">
        <div class="canvas-wrap">
          <canvas id="canvas" width="560" height="560" aria-label="Drawing canvas"></canvas>
          <div class="hint" id="hint">Draw here</div>
        </div>
        <div class="controls">
          <button id="clear" type="button">Clear</button>
          <button id="predict" type="button">Predict</button>
        </div>
      </div>

      <div class="panel result-panel">
        <div class="status" id="status">Ready. First prediction downloads ~8 MB.</div>
        <div class="hero-result" id="hero">
          <div class="empty">Your best prediction and its emoji will appear here.</div>
        </div>
        <div class="alternatives" id="alternatives"></div>
      </div>
    </section>
  </main>

  <script>
    const canvas = document.querySelector('#canvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const hint = document.querySelector('#hint');
    const status = document.querySelector('#status');
    const predictButton = document.querySelector('#predict');
    const hero = document.querySelector('#hero');
    const alternatives = document.querySelector('#alternatives');
    const servedByDemo = location.protocol === 'http:' || location.protocol === 'https:';
    let drawing = false;
    let hasInk = false;
    let requestController = null;
    let predictionTimer = null;

    function resetCanvas() {
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 22;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      hasInk = false;
      hint.classList.remove('hidden');
    }

    function point(event) {
      const bounds = canvas.getBoundingClientRect();
      return {
        x: (event.clientX - bounds.left) * canvas.width / bounds.width,
        y: (event.clientY - bounds.top) * canvas.height / bounds.height,
      };
    }

    canvas.addEventListener('pointerdown', event => {
      canvas.setPointerCapture(event.pointerId);
      drawing = true;
      hasInk = true;
      hint.classList.add('hidden');
      const p = point(event);
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x + .01, p.y + .01);
      ctx.stroke();
      clearTimeout(predictionTimer);
    });

    canvas.addEventListener('pointermove', event => {
      if (!drawing) return;
      const p = point(event);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    });

    function finishStroke(event) {
      if (!drawing) return;
      drawing = false;
      ctx.closePath();
      if (event && canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
      clearTimeout(predictionTimer);
      predictionTimer = setTimeout(predict, 650);
    }

    canvas.addEventListener('pointerup', finishStroke);
    canvas.addEventListener('pointercancel', finishStroke);

    document.querySelector('#clear').addEventListener('click', () => {
      if (requestController) requestController.abort();
      clearTimeout(predictionTimer);
      resetCanvas();
      status.textContent = 'Canvas cleared.';
      hero.innerHTML = '<div class="empty">Draw one object, then pause or press Predict.</div>';
      alternatives.replaceChildren();
    });

    predictButton.addEventListener('click', predict);

    function canvasBlob() {
      return new Promise((resolve, reject) => {
        canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('Could not encode canvas')), 'image/png');
      });
    }

    async function predict() {
      if (!servedByDemo) {
        status.innerHTML = 'This file needs the local model server. Run <code>doodle_demo/.venv/bin/python doodle_demo/app.py</code>, then use <a href="http://127.0.0.1:8766">127.0.0.1:8766</a>.';
        return;
      }
      if (!hasInk) {
        status.textContent = 'Draw something first.';
        return;
      }
      if (requestController) requestController.abort();
      requestController = new AbortController();
      predictButton.disabled = true;
      status.textContent = 'Thinking… the first prediction may download ~8 MB.';
      try {
        const blob = await canvasBlob();
        const response = await fetch('/api/predict?top_k=5', {
          method: 'POST',
          headers: { 'Content-Type': 'image/png' },
          body: blob,
          signal: requestController.signal,
        });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.error?.message || `Prediction failed (${response.status})`);
        render(payload.predictions);
        status.textContent = `Predicted locally with ${payload.model}`;
      } catch (error) {
        if (error.name !== 'AbortError') {
          status.textContent = error.message;
          hero.innerHTML = '<div class="empty">Prediction failed. Your drawing is still here—check the server output and try again.</div>';
        }
      } finally {
        predictButton.disabled = false;
      }
    }

    function render(predictions) {
      const [best, ...rest] = predictions;
      if (!best) return;
      hero.innerHTML = `
        <div class="emoji">${best.emoji || '✨'}</div>
        <div class="label">${escapeHtml(best.label)}</div>
        <div class="confidence">${percent(best.score)} emoji match</div>`;
      alternatives.innerHTML = rest.map(item => `
        <div class="alternative">
          <span>${item.emoji || '·'}</span>
          <span class="alt-label">${escapeHtml(item.label)}</span>
          <span class="score">${percent(item.score)}</span>
          <div class="bar"><span style="width:${Math.max(2, item.score * 100)}%"></span></div>
        </div>`).join('');
    }

    function percent(value) { return `${(value * 100).toFixed(value >= .1 ? 0 : 1)}%`; }
    function escapeHtml(value) {
      const node = document.createElement('span');
      node.textContent = value;
      return node.innerHTML;
    }

    resetCanvas();
    if (!servedByDemo) {
      status.innerHTML = 'Direct file mode cannot run predictions. Start <code>doodle_demo/app.py</code>, then open <a href="http://127.0.0.1:8766">127.0.0.1:8766</a>.';
    }
  </script>
</body>
</html>
