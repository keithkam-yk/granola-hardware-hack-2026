<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dogfight controllers</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; padding: 24px; background: #05070a; color: #e8edf4;
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 4px; letter-spacing: .02em; }
  .hint { color: #6a7686; margin: 0 0 24px; max-width: 720px; }
  .player {
    border: 1px solid #1d2732; border-radius: 12px; background: #0b1017;
    padding: 18px 20px; margin-bottom: 16px; max-width: 720px;
  }
  .name { font-weight: 600; }
  .meta { color: #6a7686; font-variant-numeric: tabular-nums; font-size: 13px; }
  .calibrate {
    margin: 14px 0; padding: 14px 16px; border-radius: 10px;
    background: #17212e; border: 1px solid #2c3a4a;
  }
  .calibrate.done { background: #0f1a14; border-color: #1f3d2c; color: #6a7686; }
  .step { font-size: 17px; font-weight: 600; }
  .step em { font-style: normal; color: #35d07f; }
  .axis { display: grid; grid-template-columns: 64px 1fr 64px; align-items: center; gap: 12px; margin-top: 10px; }
  .track { height: 10px; border-radius: 5px; background: #121820; position: relative; }
  .fill { position: absolute; top: 0; bottom: 0; background: #35d07f; border-radius: 5px; }
  .value { text-align: right; font-variant-numeric: tabular-nums; color: #6a7686; }
  .triggers { display: flex; gap: 12px; margin-top: 16px; }
  .trigger {
    flex: 1; text-align: center; padding: 12px; border-radius: 8px;
    background: #121820; border: 1px solid #1d2732; font-weight: 600; letter-spacing: .08em;
  }
  .trigger.on { background: #35d07f; border-color: #35d07f; color: #05070a; }
  .empty { color: #6a7686; }
  button {
    margin-top: 16px; margin-right: 8px; padding: 8px 14px; border-radius: 8px; cursor: pointer;
    background: #121820; color: #e8edf4; border: 1px solid #2c3a4a; font: inherit;
  }
</style>

<h1>Dogfight controllers</h1>
<p class="hint">Link check and stick calibration. Hold each pose and press <strong>BOOT</strong>.
   Both triggers together starts over.</p>
<div id="players"><p class="empty">Waiting for a controller to find this host&hellip;</p></div>

<script>
// Calibration by demonstration.
//
// Three attempts to derive the axis frame from the panel's 270 degree rotation
// were all wrong, and the reason is structural: the IMU is a separate part
// soldered in whatever orientation suited the board, and owes the display
// nothing. Held upright this one reads ax = -0.88, which no reading of the
// display rotation predicts.
//
// So nothing is assumed. The pilot demonstrates four extremes and each axis is
// defined as whatever actually moved. Roll comes out positive banking right and
// pitch positive nose up by construction, so there is no sign left to invert.
const POSES = [
  { key: 'level', say: 'Hold it <em>level</em>, as if flying straight' },
  { key: 'left',  say: 'Now roll <em>full left</em>' },
  { key: 'right', say: 'Now roll <em>full right</em>' },
  { key: 'down',  say: 'Now <em>nose down</em>' },
  { key: 'up',    say: 'Now <em>nose up</em>' },
];

const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const scale = (a, k) => [a[0] * k, a[1] * k, a[2] * k];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
function unit(a) {
  const length = Math.hypot(a[0], a[1], a[2]) || 1;
  return scale(a, 1 / length);
}

const angle = value => Math.asin(Math.max(-1, Math.min(1, value))) * 180 / Math.PI;

// Which axis is which, and how the pilot happens to hold it, are different
// kinds of thing and are stored separately.
//
// The mapping is discrete: this chip measured 0.998, 0.997 and 0.996 along
// single axes, so it is mounted square and the frame is snapped to whole
// numbers rather than carrying someone's wrist angle as if it were geometry.
//
// The leftover few degrees are that wrist angle, and they are kept as trim.
// Rounding them away instead would leave the stick reading three degrees at
// rest, which is a plane that turns slowly while you sit still.
function snap(axis) {
  let biggest = 0;
  for (let i = 1; i < 3; i++) if (Math.abs(axis[i]) > Math.abs(axis[biggest])) biggest = i;
  const whole = [0, 0, 0];
  whole[biggest] = Math.sign(axis[biggest]);
  return whole;
}

function frameFrom(poses) {
  const level = unit(poses.level);
  const flatten = v => {
    const flat = sub(v, scale(level, dot(v, level)));
    return unit(flat);
  };
  const measuredRight = flatten(sub(poses.right, poses.left));
  const pitched = flatten(sub(poses.up, poses.down));
  // Keep pitch independent of roll even though poses held by hand never are.
  const measuredForward = unit(sub(pitched, scale(measuredRight, dot(pitched, measuredRight))));

  const right = snap(measuredRight);
  const forward = snap(measuredForward);
  return {
    up: snap(level),
    right,
    forward,
    trim: { roll: angle(dot(level, right)), pitch: angle(dot(level, forward)) },
  };
}


function attitude(sample, frame) {
  const gravity = unit([sample[2], sample[3], sample[4]]);
  const trim = frame.trim || { roll: 0, pitch: 0 };
  return {
    roll: angle(dot(gravity, frame.right)) - trim.roll,
    pitch: angle(dot(gravity, frame.forward)) - trim.pitch,
  };
}

// The link arrives in bursts every 20-80 ms; easing costs a few milliseconds
// and stops the needles twitching between packets.
const smooth = (previous, next) => previous + (next - previous) * 0.25;

// A frame measured earlier is the normal case, so a reload flies rather than
// asking for five poses again. Saved on the host, not in this browser, so the
// game views read the same one.
let saved = null;
fetch('/calibration').then(r => r.json()).then(frame => { saved = frame; }).catch(() => {});

const cards = new Map();

function card(name) {
  if (cards.has(name)) return cards.get(name);

  const root = document.createElement('div');
  root.className = 'player';
  root.innerHTML = `
    <div class="name"></div>
    <div class="meta"></div>
    <div class="calibrate"><div class="step"></div></div>
    <div class="axis"><span>roll</span><div class="track"><div class="fill" data-roll></div></div><span class="value" data-roll-v>0&deg;</span></div>
    <div class="axis"><span>pitch</span><div class="track"><div class="fill" data-pitch></div></div><span class="value" data-pitch-v>0&deg;</span></div>
    <div class="triggers"><div class="trigger" data-left>BOOT</div><div class="trigger" data-right>PWR</div></div>
    <button data-recalibrate>Start over</button>
    <button data-panel>Send a panel test</button>`;
  root.querySelector('.name').textContent = name;
  const list = document.getElementById('players');
  const empty = list.querySelector('.empty');
  if (empty) empty.remove();
  list.append(root);

  const entry = {
    banner: root.querySelector('.calibrate'),
    step: root.querySelector('.step'),
    meta: root.querySelector('.meta'),
    left: root.querySelector('[data-left]'),
    right: root.querySelector('[data-right]'),
    rollFill: root.querySelector('[data-roll]'),
    pitchFill: root.querySelector('[data-pitch]'),
    rollValue: root.querySelector('[data-roll-v]'),
    pitchValue: root.querySelector('[data-pitch-v]'),
    index: cards.size,
    poses: {}, at: 0, frame: saved, roll: 0, pitch: 0, recent: [],
  };

  entry.restart = () => { entry.poses = {}; entry.at = 0; entry.frame = null; };
  root.querySelector('[data-recalibrate]').onclick = entry.restart;
  root.querySelector('[data-panel]').onclick = () => fetch('/', {
    method: 'POST',
    body: JSON.stringify({
      player: entry.index,
      hp: 42, wl: 18, wr: 95, spd: 310,
      gl: 'CANNON', al: 120, gr: 'MISSILE', ar: 4,
    }),
  });

  cards.set(name, entry);
  return entry;
}

// A pose is the middle of the last half second, so the thumb pressing the
// button cannot tilt the answer it records.
function median(samples, index) {
  const values = samples.map(s => s[index]).sort((a, b) => a - b);
  return values[Math.floor(values.length / 2)] || 0;
}

function setAxis(fill, value, degrees, limit = 90) {
  const clamped = Math.max(-limit, Math.min(limit, degrees));
  const half = Math.abs(clamped) / limit * 50;
  fill.style.left = (clamped < 0 ? 50 - half : 50) + '%';
  fill.style.width = half + '%';
  value.textContent = Math.round(degrees) + '°';
}

new EventSource('/stream').onmessage = function (event) {
  const payload = JSON.parse(event.data);
  for (const player of payload.players) {
    const view = card(player.name);
    if (!player.samples.length) continue;

    view.recent.push(...player.samples);
    if (view.recent.length > 50) view.recent = view.recent.slice(-50);
    const last = player.samples[player.samples.length - 1];

    const boot = last[8] === 1, pwr = last[9] === 1;
    const bothHeld = boot && pwr;

    if (bothHeld && !view.bothHeld) {
      view.restart();
    } else if (boot && !view.boot && view.at < POSES.length) {
      view.poses[POSES[view.at].key] =
        [median(view.recent, 2), median(view.recent, 3), median(view.recent, 4)];
      view.at += 1;
      if (view.at === POSES.length) {
        view.frame = frameFrom(view.poses);
        fetch('/calibration', { method: 'POST', body: JSON.stringify(view.frame) });
      }
    }
    view.boot = boot;
    view.bothHeld = bothHeld;

    if (view.frame) {
      view.banner.className = 'calibrate done';
      view.step.textContent = 'Calibrated. Both triggers together to start over.';
      const measured = attitude(last, view.frame);
      view.roll = smooth(view.roll, measured.roll);
      view.pitch = smooth(view.pitch, measured.pitch);
    } else {
      view.banner.className = 'calibrate';
      view.step.innerHTML =
        'Step ' + (view.at + 1) + ' of ' + POSES.length + ': ' +
        POSES[view.at].say + ', then press BOOT';
    }

    setAxis(view.rollFill, view.rollValue, view.roll);
    setAxis(view.pitchFill, view.pitchValue, view.pitch);

    view.left.classList.toggle('on', boot);
    view.right.classList.toggle('on', pwr);
    view.meta.textContent =
      (player.header.rate_hz || '?') + ' Hz · ' + player.dropped + ' dropped · ' +
      'ax ' + last[2] + ' ay ' + last[3] + ' az ' + last[4];
  }
};
</script>
