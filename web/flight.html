<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QMI8658 Flight Controls Lab</title>
  <style>
    :root { color-scheme: dark; --ink:#f4fbff; --muted:#a8bdc7; --glass:rgba(7,20,29,.58); --line:rgba(255,255,255,.18); --mint:#86ffd0; --amber:#ffd77d; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #78c9df; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    canvas { display: block; width: 100%; height: 100%; }
    .chrome { position: fixed; inset: 0; pointer-events: none; color: var(--ink); text-shadow: 0 2px 12px rgba(0,0,0,.34); }
    .topbar { position: absolute; left: 22px; right: 22px; top: 20px; display: flex; justify-content: space-between; align-items: flex-start; gap: 18px; }
    .brand h1 { margin: 2px 0 3px; font-size: clamp(20px, 3vw, 34px); letter-spacing: -.045em; }
    .brand p { margin: 0; color: rgba(244,251,255,.74); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
    .actions { display: flex; gap: 8px; pointer-events: auto; }
    .action { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; color: var(--ink); background: var(--glass); text-decoration: none; font: inherit; font-size: 12px; cursor: pointer; backdrop-filter: blur(12px); }
    .action:hover { background: rgba(7,20,29,.76); }
    .status { position: absolute; right: 22px; bottom: 20px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .badge { border: 1px solid var(--line); border-radius: 999px; padding: 7px 10px; color: rgba(244,251,255,.72); background: var(--glass); font-size: 10px; font-weight: 760; letter-spacing: .09em; text-transform: uppercase; backdrop-filter: blur(12px); }
    .badge.live { color: var(--mint); border-color: rgba(134,255,208,.45); }
    .badge.active { color: #092118; background: var(--mint); border-color: var(--mint); text-shadow: none; box-shadow: 0 0 28px rgba(134,255,208,.4); }
    .telemetry { position: absolute; left: 22px; bottom: 20px; display: grid; grid-template-columns: repeat(6, auto); gap: 8px; }
    .readout { min-width: 86px; border-left: 2px solid rgba(255,255,255,.6); padding: 3px 10px; }
    .readout small { display: block; color: rgba(244,251,255,.65); font-size: 9px; font-weight: 750; letter-spacing: .13em; text-transform: uppercase; }
    .readout strong { display: block; margin-top: 2px; font: 700 17px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .help { position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); border: 1px solid var(--line); border-radius: 999px; padding: 9px 14px; background: var(--glass); color: rgba(244,251,255,.82); font-size: 12px; white-space: nowrap; backdrop-filter: blur(12px); transition: .2s ease; }
    .help.active { color: var(--mint); border-color: rgba(134,255,208,.5); }
    .reticle { position: absolute; left: 50%; top: 50%; width: 76px; height: 44px; margin: -22px -38px; opacity: .9; }
    .reticle::before { content:""; position:absolute; left:0; right:0; top:21px; height:2px; background:var(--ink); clip-path:polygon(0 0, 31% 0, 31% 100%, 69% 100%, 69% 0, 100% 0, 100% 100%, 0 100%); }
    .reticle::after { content:""; position:absolute; left:37px; top:12px; width:2px; height:20px; background:var(--ink); }
    @media (max-width:900px) { .telemetry { grid-template-columns: repeat(3, auto); bottom: 70px; } .status { bottom: 16px; left: 18px; right: 18px; justify-content: center; } .help { bottom: 148px; } .brand p { display:none; } .action { padding: 8px 9px; } }
  </style>
</head>
<body>
  <canvas id="scene" aria-label="Flight controls simulator over a flat grid"></canvas>
  <div class="chrome">
    <div class="topbar">
      <div class="brand"><p>Flat-grid controls test</p><h1>Flight Lab</h1></div>
      <div class="actions"><a class="action" href="/">← Motion lab</a></div>
    </div>
    <div class="reticle"></div>
    <div class="telemetry">
      <div class="readout"><small>Altitude</small><strong id="altitude">840 m</strong></div>
      <div class="readout"><small>Airspeed</small><strong id="speed">120 kt</strong></div>
      <div class="readout"><small>Heading</small><strong id="heading">000°</strong></div>
      <div class="readout"><small>Roll</small><strong id="rollAngle">—</strong></div>
      <div class="readout"><small>Pitch</small><strong id="pitchAngle">—</strong></div>
      <div class="readout"><small>Yaw</small><strong id="yawAngle">—</strong></div>
    </div>
    <div class="help active" id="help">Rotate to fly · BOOT boosts · PWR airbrakes</div>
    <div class="status"><span class="badge" id="serial">USB waiting</span><span class="badge" id="gyro">Gyro calibrating</span><span class="badge" id="boot">BOOT</span><span class="badge" id="pwr">PWR</span></div>
  </div>
  <script>
    const canvas = document.querySelector('#scene');
    const ctx = canvas.getContext('2d');
    let width = 1, height = 1, dpr = 1;
    let last = performance.now(), distance = 0, heading = 0, altitude = 840;
    let targetRoll = 0, targetPitch = 0, roll = 0, pitch = 0;
    let bootPressed = false, pwrPressed = false;
    let orientationCalibrated = false, orientationAt = 0, yawControl = 0;
    let lastAltitudeSent = null, lastAltitudeSentAt = 0;

    const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
    const mix = (a, b, t) => a + (b - a) * t;

    function resize() {
      dpr = Math.min(2, window.devicePixelRatio || 1);
      width = window.innerWidth; height = window.innerHeight;
      canvas.width = Math.round(width * dpr); canvas.height = Math.round(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function steer(dx, dy) {
      targetRoll = clamp(targetRoll + dx * .008, -.95, .95);
      targetPitch = clamp(targetPitch + dy * .006, -.52, .52);
    }

    function setButtons(state) {
      bootPressed = orientationCalibrated && !!state.boot;
      pwrPressed = orientationCalibrated && !!state.pwr;
      const boot = document.querySelector('#boot');
      const pwr = document.querySelector('#pwr');
      boot.textContent = bootPressed ? 'BOOT · boost' : 'BOOT';
      pwr.textContent = pwrPressed ? 'PWR · brake' : 'PWR';
      boot.className = `badge ${bootPressed ? 'active' : ''}`;
      pwr.className = `badge ${pwrPressed ? 'active' : ''}`;
    }

    function setOrientation(state) {
      orientationCalibrated = !!state.calibrated;
      orientationAt = performance.now();
      document.querySelector('#rollAngle').textContent = `${Number(state.roll).toFixed(0)}°`;
      document.querySelector('#pitchAngle').textContent = `${Number(state.pitch).toFixed(0)}°`;
      document.querySelector('#yawAngle').textContent = `${Number(state.yaw).toFixed(0)}°`;
      const gyro = document.querySelector('#gyro');
      const help = document.querySelector('#help');
      if (orientationCalibrated) {
        targetRoll = clamp(Number(state.rollNorm) * .95, -.95, .95);
        targetPitch = clamp(Number(state.pitchNorm) * .52, -.52, .52);
        yawControl = clamp(Number(state.yawNorm), -1, 1);
        gyro.textContent = '3-axis calibrated';
        gyro.className = 'badge live';
        help.textContent = 'Roll · pitch · yaw live · BOOT boosts · PWR airbrakes';
      } else {
        yawControl = 0;
        const step = String(state.step || 'gyro').replaceAll('_', ' ');
        gyro.textContent = `Setup · ${step}`;
        gyro.className = 'badge';
        help.textContent = 'Follow the board screen and press BOOT for each pose';
      }
    }

    function polygon(points, fill) {
      ctx.beginPath(); ctx.moveTo(points[0][0], points[0][1]);
      for (let i = 1; i < points.length; i++) ctx.lineTo(points[i][0], points[i][1]);
      ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
    }

    function drawSky(horizon) {
      const sky = ctx.createLinearGradient(0, 0, 0, horizon);
      sky.addColorStop(0, '#52a9d2'); sky.addColorStop(.72, '#8bcbdc'); sky.addColorStop(1, '#d9e9d4');
      ctx.fillStyle = sky; ctx.fillRect(0, 0, width, Math.max(height, horizon));
      const sunX = width * .72 - Math.sin(heading) * width * .12;
      const sunY = Math.max(65, horizon * .42);
      ctx.fillStyle = 'rgba(255,238,169,.92)'; ctx.beginPath(); ctx.arc(sunX, sunY, 34, 0, Math.PI * 2); ctx.fill();
    }

    function drawGrid(horizon) {
      const groundTop = horizon + 1;
      const ground = ctx.createLinearGradient(0, groundTop, 0, height);
      ground.addColorStop(0, '#4f7465');
      ground.addColorStop(1, '#183f3d');
      ctx.fillStyle = ground;
      ctx.fillRect(-width, groundTop, width * 3, height - groundTop);

      const vanishingX = width / 2 + Math.sin(heading) * width * .48;
      const farWidth = width * 4.5;
      const forwardOffset = (distance * .018) % 1;
      ctx.lineWidth = 1;

      // Lines parallel to the direction of travel converge at the horizon.
      for (let column = -24; column <= 24; column++) {
        const endX = width / 2 + column * farWidth / 24;
        const major = column % 4 === 0;
        ctx.strokeStyle = major ? 'rgba(151,255,219,.48)' : 'rgba(151,255,219,.20)';
        ctx.lineWidth = major ? 1.5 : 1;
        ctx.beginPath(); ctx.moveTo(vanishingX, groundTop); ctx.lineTo(endX, height + 2); ctx.stroke();
      }

      // Exponential spacing gives a large flat plane with continuous forward motion.
      for (let row = 0; row < 34; row++) {
        const depth = (row + forwardOffset) / 34;
        const eased = depth * depth * depth;
        const y = groundTop + (height - groundTop) * eased;
        const major = row % 5 === 0;
        ctx.strokeStyle = major ? 'rgba(151,255,219,.52)' : 'rgba(151,255,219,.22)';
        ctx.lineWidth = major ? 1.6 : 1;
        ctx.beginPath(); ctx.moveTo(-width * 2, y); ctx.lineTo(width * 3, y); ctx.stroke();
      }

      ctx.strokeStyle = 'rgba(224,255,241,.72)';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-width, groundTop); ctx.lineTo(width * 2, groundTop); ctx.stroke();
    }

    function drawAircraft() {
      ctx.save(); ctx.translate(width/2, height*.63); ctx.rotate(roll * .45);
      polygon([[-84,8],[-16,-3],[-7,-40],[0,-48],[8,-39],[18,-3],[86,9],[82,18],[14,11],[9,42],[0,48],[-10,41],[-15,11],[-81,17]], 'rgba(241,247,237,.95)');
      polygon([[-84,8],[-16,-3],[0,4],[-81,17]], '#d34c3e');
      polygon([[0,-48],[8,-39],[18,-3],[0,4]], '#f4bf4f');
      ctx.fillStyle = 'rgba(7,24,31,.72)'; ctx.beginPath(); ctx.ellipse(0,-12,7,15,0,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }

    function syncAltitudeToBoard(now) {
      const metres = Math.round(altitude);
      if (metres === lastAltitudeSent || now - lastAltitudeSentAt < 200) return;
      lastAltitudeSent = metres;
      lastAltitudeSentAt = now;
      fetch('/api/flight/altitude', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({altitude: metres})
      }).catch(() => {});
    }

    function frame(now) {
      const dt = Math.min(.04, (now - last) / 1000); last = now;
      const orientationLive = orientationCalibrated && now - orientationAt < 350;
      if (!orientationLive) {
        targetRoll *= Math.pow(.18, dt);
        targetPitch *= Math.pow(.18, dt);
        yawControl *= Math.pow(.1, dt);
      }
      roll = mix(roll, targetRoll, 1 - Math.pow(.012, dt));
      pitch = mix(pitch, targetPitch, 1 - Math.pow(.02, dt));
      heading = (heading + (roll * .18 + yawControl * .42) * dt + Math.PI * 2) % (Math.PI * 2);
      altitude = clamp(altitude - pitch * dt * 120, 120, 2400);
      const speed = pwrPressed ? 62 : bootPressed ? 178 : 120;
      distance += dt * speed * .65;

      const horizon = clamp(height * (.43 - pitch * .28), height*.2, height*.68);
      ctx.save(); ctx.translate(width/2, height/2); ctx.rotate(-roll*.18); ctx.translate(-width/2,-height/2);
      drawSky(horizon); drawGrid(horizon); ctx.restore();
      drawAircraft();
      document.querySelector('#altitude').textContent = `${Math.round(altitude)} m`;
      document.querySelector('#speed').textContent = `${Math.round(speed + Math.abs(pitch)*18)} kt`;
      document.querySelector('#heading').textContent = `${String(Math.round(heading * 180 / Math.PI) % 360).padStart(3,'0')}°`;
      syncAltitudeToBoard(now);
      canvas.dataset.roll = roll.toFixed(3);
      canvas.dataset.pitch = pitch.toFixed(3);
      requestAnimationFrame(frame);
    }

    const source = new EventSource('/events');
    source.onopen = () => { const badge = document.querySelector('#serial'); badge.textContent = 'USB live'; badge.className = 'badge live'; };
    source.onerror = () => { const badge = document.querySelector('#serial'); badge.textContent = 'USB reconnecting'; badge.className = 'badge'; };
    source.onmessage = event => {
      const data = JSON.parse(event.data);
      if (data.type === 'cursor' && !orientationCalibrated) steer(Number(data.dx), Number(data.dy));
      if (data.type === 'orientation') setOrientation(data);
      if (data.type === 'airmouse') {
        setButtons(data);
        if (!data.calibrated) {
          const gyro = document.querySelector('#gyro');
          gyro.textContent = 'Keep board still';
          gyro.className = 'badge';
        }
      }
    };

    const keys = new Set();
    window.addEventListener('keydown', event => {
      if (!event.key.startsWith('Arrow')) return;
      event.preventDefault(); keys.add(event.key);
      if (event.key === 'ArrowLeft') targetRoll -= .09;
      if (event.key === 'ArrowRight') targetRoll += .09;
      if (event.key === 'ArrowUp') targetPitch -= .065;
      if (event.key === 'ArrowDown') targetPitch += .065;
      targetRoll = clamp(targetRoll, -.95, .95); targetPitch = clamp(targetPitch, -.52, .52);
    });
    window.addEventListener('keyup', event => keys.delete(event.key));

    window.addEventListener('resize', resize); resize(); requestAnimationFrame(frame);
  </script>
</body>
</html>
